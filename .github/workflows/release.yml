name: Release KCD Hukuk apps

# Push to the `release` branch to build the Mac and Windows apps, publish them
# as release v<version> (version from src-tauri/tauri.conf.json), and let every
# installed copy update itself.
on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: windows-latest
            args: ''
            rust_targets: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install build tools
        run: npm ci

      - name: Build, sign and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
          # With an Apple Developer account later, add APPLE_CERTIFICATE,
          # APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY, APPLE_ID,
          # APPLE_PASSWORD and APPLE_TEAM_ID here for a one-click Mac install.
        with:
          tagName: v__VERSION__
          releaseName: 'KCD Hukuk v__VERSION__'
          releaseBody: |
            KCD Hukuk masaüstü uygulaması.
            Mac: KCD-Hukuk-Mac.dmg · Windows: KCD-Hukuk-Windows.exe
            Web: https://claude.ai/artifact/NVbQeseTENp9AaaCnCCdor
            Yüklü uygulamalar bu sürümü kendiliğinden alır.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}

      - name: Add installers with fixed names
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v$(node -p "require('./src-tauri/tauri.conf.json').version")"
          if [ "$RUNNER_OS" = "macOS" ]; then
            F=$(ls src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg | head -1)
            cp "$F" KCD-Hukuk-Mac.dmg
            gh release upload "$TAG" KCD-Hukuk-Mac.dmg --clobber
          else
            F=$(ls src-tauri/target/release/bundle/nsis/*-setup.exe | head -1)
            cp "$F" KCD-Hukuk-Windows.exe
            gh release upload "$TAG" KCD-Hukuk-Windows.exe --clobber
          fi


name: Windows installer

# Builds the Windows installer (NSIS) and attaches it to an existing release as
# KCD-Hukuk-Windows.exe. Run by hand: Actions › Windows installer › Run workflow.
# No signing secret needed: self-update files are not produced by this job.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach the installer to'
        required: true
        default: 'v3.0.0'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - name: Install build tools
        run: npm ci
      - name: Build installer
        shell: bash
        run: npx tauri build --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Attach to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          F=$(ls src-tauri/target/release/bundle/nsis/*-setup.exe | head -1)
          cp "$F" KCD-Hukuk-Windows.exe
          gh release upload "${{ inputs.tag }}" KCD-Hukuk-Windows.exe --clobber
